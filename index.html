<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Bernardo para Mamãe ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            padding: 45px 30px;
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            max-width: 100%;
            width: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .heart {
            font-size: 5.5rem;
            animation: heartbeat 1.3s infinite;
            display: block;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        h1 {
            font-size: 2.6rem;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #e91e63;
        }

        .subtitle {
            font-size: 1.35rem;
            color: #555;
            margin-bottom: 45px;
            font-weight: 400;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 16px auto;
            padding: 20px 25px;
            font-size: 1.35rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .btn1 {
            background: linear-gradient(45deg, #ff6b6b, #f06292);
            color: white;
        }

        .btn1:hover, .btn1:active {
            transform: scale(1.06);
            box-shadow: 0 15px 35px rgba(240, 98, 146, 0.45);
        }

        .btn2 {
            background: linear-gradient(45deg, #4ecdc4, #26a69a);
            color: white;
        }

        .btn2:hover, .btn2:active {
            transform: scale(1.06);
            box-shadow: 0 15px 35px rgba(38, 166, 154, 0.45);
        }

        footer {
            margin-top: 50px;
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
        }

        /* Ajustes extras para telas muito pequenas */
        @media (max-width: 360px) {
            .container {
                padding: 35px 20px;
            }
            h1 {
                font-size: 2.3rem;
            }
            .heart {
                font-size: 4.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="heart">❤️</span>
        <h1>De Bernardo<br>para Mamãe</h1>
        <p class="subtitle">Te amo demais, viu? 💕</p>

        <a href="https://youtu.be/5sfALeZy5Zw?si=c1hqoiuQ04rT5tS7" target="_blank" class="btn btn1">
            Eu também te amo
        </a>

        <a href="https://youtu.be/7pXGmB6Y8TE?si=6t0r7iWC7__YjNg3" target="_blank" class="btn btn2">
            Vai arrumar o que fazer
        </a>

        <footer>
            Feito com muito carinho pro meu maior amor ❤️
        </footer>
    </div>
</body>
</html>
