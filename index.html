<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qual é a banda favorita do Bernardo?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 40px;
      color: #ffcc00;
    }
    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }
    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.1);
    }
    #restartBtn {
      background-color: #ff4444;
      color: white;
    }
    #raimundosBtn {
      background-color: #00cc66;
      color: white;
    }
    #gameover {
      display: none;
      flex-direction: column;
      align-items: center;
    }
    #gameover h2 {
      font-size: 3em;
      color: #ff0000;
      margin-bottom: 20px;
    }
    #gameover p {
      font-size: 1.8em;
      color: #ffcc00;
      margin-bottom: 40px;
    }
    .gameover-buttons button {
      padding: 15px 35px;
      font-size: 1.3em;
      margin: 0 15px;
    }
    #reniciarBtn {
      background-color: #00cc66;
      color: white;
    }
    #burroBtn {
      background-color: #ff4444;
      color: white;
    }
  </style>
</head>
<body>

  <div id="mainScreen">
    <h1>Qual é a banda favorita do Bernardo?</h1>
    
    <div class="buttons">
      <button id="restartBtn">Restart</button>
      <button id="raimundosBtn">Raimundos</button>
    </div>
  </div>

  <div id="gameover">
    <h2>ERROU OTÁRIO!!!</h2>
    <p>GAME OVER</p>
    
    <div class="gameover-buttons">
      <button id="reniciarBtn">Reiniciar</button>
      <button id="burroBtn">Continuar sendo burro</button>
    </div>
  </div>

  <script>
    // Elementos
    const mainScreen = document.getElementById('mainScreen');
    const gameoverScreen = document.getElementById('gameover');
    
    const restartBtn = document.getElementById('restartBtn');
    const raimundosBtn = document.getElementById('raimundosBtn');
    const reniciarBtn = document.getElementById('reniciarBtn');
    const burroBtn = document.getElementById('burroBtn');

    // Função para mostrar Game Over
    function showGameOver() {
      mainScreen.style.display = 'none';
      gameoverScreen.style.display = 'flex';
    }

    // Clique no botão "Restart" (errado)
    restartBtn.addEventListener('click', () => {
      showGameOver();
    });

    // Clique no botão "Raimundos" (correto)
    raimundosBtn.addEventListener('click', () => {
      window.location.href = "https://youtu.be/TQ7V5tbX-DM?si=tQ9BLvhfDFG9i-TK";
    });

    // Botão "Reiniciar"
    reniciarBtn.addEventListener('click', () => {
      location.reload(); // reinicia a página
    });

    // Botão "Continuar sendo burro"
    burroBtn.addEventListener('click', () => {
      alert("Então tchau 😂");
      // Fecha a aba ou mostra mensagem final
      document.body.innerHTML = `
        <h1 style="color:#ff0000; font-size:4em; margin-top:200px;">
          Tchau otário!
        </h1>
      `;
    });
  </script>

</body>
</html>
